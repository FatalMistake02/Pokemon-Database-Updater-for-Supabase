name: Publish Card Catalog

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-card-catalog
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_2: ${{ secrets.DATABASE_URL_2 }}
      DATABASE_URLS: ${{ secrets.DATABASE_URLS }}
      CARD_CATALOG_URL: ${{ vars.CARD_CATALOG_URL || 'https://cardlyapp.github.io/cards-database' }}
    steps:
      - name: Check out updater
        uses: actions/checkout@v4

      - name: Check out cards database
        uses: actions/checkout@v4
        with:
          repository: Cardlyapp/cards-database
          token: ${{ secrets.CARDS_DATABASE_TOKEN }}
          path: cards-database

      - name: Check for a new TCGdex cards-database release
        id: tcgdex_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT_RELEASE="$(python - <<'PY'
          import json
          from pathlib import Path

          path = Path("cards-database/manifest.json")
          try:
              print(json.loads(path.read_text(encoding="utf-8")).get("tcgdexRelease", ""))
          except (OSError, ValueError):
              print("")
          PY
          )"
          if ! LATEST_RELEASE="$(gh api repos/tcgdex/cards-database/releases/latest --jq .tag_name)"; then
            echo "Could not check the latest TCGdex release; cards will remain unchanged."
            echo "latest=$CURRENT_RELEASE" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$LATEST_RELEASE" = "$CURRENT_RELEASE" ]; then
            echo "TCGdex release $LATEST_RELEASE is already published."
            echo "latest=$LATEST_RELEASE" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New TCGdex release: ${CURRENT_RELEASE:-none} -> $LATEST_RELEASE"
            echo "latest=$LATEST_RELEASE" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild card catalog for new TCGdex release
        if: steps.tcgdex_release.outputs.changed == 'true'
        run: >-
          python github_catalog_updater.py
          --output cards-database
          --workers 8
          --tcgdex-release "${{ steps.tcgdex_release.outputs.latest }}"

      - name: Refresh prices without rebuilding cards
        if: steps.tcgdex_release.outputs.changed != 'true'
        run: python github_catalog_updater.py --output cards-database --prices-only --workers 8

      - name: Commit and push changed catalog
        working-directory: cards-database
        shell: bash
        run: |
          git config user.name "cardly-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add manifest.json data/sets.json data/cards.json data/prices.json data-asia/sets.json data-asia/cards.json data-asia/prices.json
          if git diff --cached --quiet; then
            echo "Catalog source data has not changed."
            exit 0
          fi
          git commit -m "Update card catalog"
          git push

      - name: Bulk update cards and prices for new release
        if: steps.tcgdex_release.outputs.changed == 'true'
        run: >-
          python pokemon-db-updater.py
          --catalog-url "$CARD_CATALOG_URL"
          --expected-catalog-manifest cards-database/manifest.json
          --db-target both
          --version both
          --batch-size 100

      - name: Update only prices when cards are unchanged
        if: steps.tcgdex_release.outputs.changed != 'true'
        run: >-
          python pokemon-db-updater.py
          --catalog-url "$CARD_CATALOG_URL"
          --expected-catalog-manifest cards-database/manifest.json
          --prices-only
          --db-target both
          --version both
          --batch-size 100
